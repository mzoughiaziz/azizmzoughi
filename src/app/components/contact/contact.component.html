<section class="contact py-5" id="contact">
  <div class="container">
    <div class="row">

      <div class="col-lg-5 mr-lg-5 col-12">
        <div class="w-100">
          <a href="https://wa.me/351935803631?text=Hi%20Aziz%2C%20I%27d%20like%20to%20get%20in%20touch." target="_blank"
            rel="noopener" aria-label="Contact Aziz on WhatsApp">
            <img class="whatsapp" src="images/undraw/whatsapp.png" height="80" width="80" loading="lazy"
              alt="WhatsApp icon" /><br>
            <p> Contact me on WhatsApp</p>
          </a>
        </div>
        <br>
        <div class="contact-info d-flex justify-content-between align-items-center py-4 px-lg-5">
          <div class="contact-info-item">
            <h3 class="mb-3 text-white">Let's talk</h3>
            <p class="footer-text mb-0"><a href="tel:+351935803631" class="text-white">+351 935 803 631</a></p>
            <p><a href="mailto:mzoughiaziz@techie.com">mzoughiaziz&#64;techie.com</a></p>
          </div>

          <ul class="social-links">
            <li><a href="https://www.linkedin.com/in/mzoughi-aziz" target="_blank" rel="noopener"
                aria-label="LinkedIn profile">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path
                    d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.03-1.85-3.03-1.86 0-2.15 1.45-2.15 2.94v5.66H9.35V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z" />
                </svg>
              </a></li>
            <li><a href="https://github.com/mzoughiaziz" target="_blank" rel="noopener" aria-label="GitHub profile">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path
                    d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.49 0-.24-.01-1.04-.01-1.89-2.78.62-3.37-1.22-3.37-1.22-.46-1.2-1.11-1.52-1.11-1.52-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.89 1.57 2.34 1.12 2.91.86.09-.66.35-1.12.63-1.38-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.32.1-2.75 0 0 .84-.28 2.75 1.05a9.3 9.3 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.43.2 2.49.1 2.75.64.72 1.03 1.63 1.03 2.75 0 3.94-2.35 4.8-4.58 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.6.69.49A10.26 10.26 0 0 0 22 12.25C22 6.58 17.52 2 12 2z" />
                </svg>
              </a></li>
            <li><a href="https://www.instagram.com/mzoughi_aziz" target="_blank" rel="noopener"
                class="uil uil-instagram" aria-label="Instagram profile"></a></li>
          </ul>
        </div>
      </div>

      <div class="col-lg-6 col-12">
        <div class="contact-form">
          <h2 class="mb-4">Interested to work together? Let's talk</h2>

          <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="row">
              <div class="col-lg-6 col-12">
                <label for="name" class="sr-only">Your Name</label>
                <input type="text" class="form-control" formControlName="name" placeholder="Your Name" id="name">
                <p class="field-error" *ngIf="name.invalid && name.touched">Please enter your name.</p>
              </div>

              <div class="col-lg-6 col-12">
                <label for="email" class="sr-only">Email</label>
                <input type="email" class="form-control" formControlName="email" placeholder="Email" id="email">
                <p class="field-error" *ngIf="email.invalid && email.touched">Please enter a valid email.</p>
              </div>

              <div class="col-12">
                <label for="message" class="sr-only">Message</label>
                <textarea rows="6" class="form-control" formControlName="message" id="message"
                  placeholder="Message"></textarea>
                <p class="field-error" *ngIf="message.invalid && message.touched">Please add a short message.</p>
              </div>

              <div class="col-12" *ngIf="errorMessage()">
                <p class="field-error">{{ errorMessage() }}</p>
              </div>

              <div class="ml-lg-auto col-lg-5 col-12">
                <input type="submit" class="form-control submit-btn" [value]="sending() ? 'Sending…' : 'Let\'s Go'"
                  [disabled]="sending()">
              </div>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- CONTACT CONFIRMATION MODAL -->
<div class="modal-backdrop" *ngIf="showModal()" (click)="onBackdropClick($event)">
  <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle" tabindex="-1"
    #modalPanel>
    <button type="button" class="modal-close" (click)="closeModal()" aria-label="Close">
      <i class="uil uil-times" aria-hidden="true"></i>
    </button>
    <div class="modal-icon"><i class="uil uil-check-circle" aria-hidden="true"></i></div>
    <h3 id="confirmModalTitle">Message sent!</h3>
    <p>Thanks for reaching out — I usually reply within 24 hours.</p>
    <button type="button" class="btn custom-btn custom-btn-bg" (click)="closeModal()">Got it</button>
  </div>
</div>
